name: Feature request
description: Propose a focused improvement to Inkstone Annotations.
title: '[Feature] '
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user problem before proposing an implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should the user be able to accomplish?
    validations:
      required: true
  - type: dropdown
    id: workflow
    attributes:
      label: Product area
      options:
        - Text annotation
        - Snapshot capture
        - Snapshot drawing or editing
        - Sidebar or Entire Vault
        - Export and portability
        - Persistence and recovery
        - Mobile or accessibility
        - Developer or release workflow
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: boundaries
    attributes:
      label: Product boundaries
      options:
        - label: This request does not rely on silently rebinding ambiguous text.
          required: true
        - label:
            This request does not add telemetry or an external service without an explicit product
            decision.
          required: true
